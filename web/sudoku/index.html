<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sudoku</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header class="app__header">
            <h1>Sudoku</h1>
            <div class="controls">
                <button id="new-easy" data-difficulty="easy">New Easy</button>
                <button id="new-medium" data-difficulty="medium">New Medium</button>
                <button id="new-hard" data-difficulty="hard">New Hard</button>
                <button id="solve">Solve</button>
                <button id="check">Check</button>
                <button id="clear">Clear</button>
                <label class="toggle">
                    <input type="checkbox" id="notes-toggle">
                    <span>Notes</span>
                </label>
            </div>
        </header>

        <main class="app__main">
            <section class="board" id="board" aria-label="Sudoku board" role="grid"></section>
            <section class="keypad" aria-label="Number keypad">
                <div class="keypad__row">
                    <button class="key" data-key="1">1</button>
                    <button class="key" data-key="2">2</button>
                    <button class="key" data-key="3">3</button>
                </div>
                <div class="keypad__row">
                    <button class="key" data-key="4">4</button>
                    <button class="key" data-key="5">5</button>
                    <button class="key" data-key="6">6</button>
                </div>
                <div class="keypad__row">
                    <button class="key" data-key="7">7</button>
                    <button class="key" data-key="8">8</button>
                    <button class="key" data-key="9">9</button>
                </div>
                <div class="keypad__row">
                    <button class="key key--erase" data-key="erase">Erase</button>
                </div>
            </section>
        </main>

        <footer class="app__footer">
            <div id="status" role="status" aria-live="polite"></div>
        </footer>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
